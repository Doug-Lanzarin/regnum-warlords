name = "regnum-warlords-push"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# @block65/webcrypto-web-push references node:crypto as a fallback for
# non-Workers runtimes (never actually taken here, since Workers always has
# globalThis.crypto) — this flag silences the bundler warning and is the
# officially recommended fix either way.
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "PUSH_KV"
# Replace with the ID printed by:
#   npx wrangler kv namespace create push_state
id = "REPLACE_ME_KV_NAMESPACE_ID"

[vars]
# The deployed app's origin — used for CORS on /subscribe and /unsubscribe,
# and as the VAPID "sub" claim (any https:// or mailto: URL is valid there).
# Replace with your real Vercel domain before deploying.
ALLOWED_ORIGIN = "https://REPLACE-ME.vercel.app"
VAPID_SUBJECT = "https://REPLACE-ME.vercel.app"
# The PUBLIC half of the VAPID keypair — safe to commit/expose (the client
# needs it too, as VITE_VAPID_PUBLIC_KEY). The PRIVATE half is a secret —
# never put it here, see README.md.
VAPID_PUBLIC_KEY = "REPLACE_ME_VAPID_PUBLIC_KEY"
